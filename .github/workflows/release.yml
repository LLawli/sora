# Release — triggered by a version tag (the flow is: bin/release X.Y.Z, then
# git push origin main vX.Y.Z). Builds nothing (pure shell): the release
# tarball IS the artifact, and every install path (curl|sh, direct download,
# mise, the Homebrew tap) consumes that same tarball.
#
# Actions are pinned to a commit SHA, never a tag — see the note in ci.yml.
# It matters more here than there: this workflow holds TAP_GITHUB_TOKEN and
# publishes the artifact users install, so a repointed tag would be a supply
# chain compromise with a credential attached.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shells under test
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish shellcheck

      - name: Run test suite and lint
        run: |
          bash tests/run.sh
          make lint

      - name: Check tag matches SORA_VERSION
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(grep -oP '^SORA_VERSION="\K[^"]+' bin/sora)
          if [ "$VERSION" != "$CODE_VERSION" ]; then
            echo "tag v$VERSION does not match SORA_VERSION=$CODE_VERSION in bin/sora" >&2
            exit 1
          fi

      - name: Build tarball and checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="sora-$VERSION/" \
            -o "sora-$VERSION.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "sora-$VERSION.tar.gz" > "sora-$VERSION.tar.gz.sha256"

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release_body.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "# Recommended"
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/packaging/install.sh | sh"
            echo
            echo "# Or grab the tarball directly"
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/sora-$VERSION.tar.gz | tar xz"
            echo '```'
            echo
            echo "Also available via \`mise use -g github:${GITHUB_REPOSITORY}\` and \`brew install LLawli/tap/sora\`."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat "sora-$VERSION.tar.gz.sha256"
            echo '```'
          } >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release_body.md
          files: |
            sora-*.tar.gz
            sora-*.tar.gz.sha256

  # Bump the Homebrew tap formula to point at the fresh tarball — same
  # "one artifact, many wrappers" idea: the formula consumes the release
  # tarball published above. Needs a TAP_GITHUB_TOKEN secret (PAT with push
  # access to LLawli/homebrew-tap); the job no-ops politely without it.
  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_GITHUB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "TAP_GITHUB_TOKEN not set; skipping tap bump" >&2
          fi

      - name: Checkout tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LLawli/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update formula
        if: steps.token.outputs.present == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/sora-$VERSION.tar.gz"
          curl -fsSL -o sora.tar.gz "$URL"
          SHA=$(sha256sum sora.tar.gz | awk '{print $1}')
          rm sora.tar.gz
          cat > Formula/sora.rb <<EOF
          class Sora < Formula
            desc "Distrobox commands as if they were native host commands"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "$URL"
            sha256 "$SHA"
            license "MIT"

            def install
              system "make", "install", "PREFIX=#{prefix}"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sora version")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sora.rb
          git commit -m "sora v$VERSION"
          git push
